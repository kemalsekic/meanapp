<mat-card>
  <div style="width: 640px; height: 480px; margin: 10px; position: relative;">
    <iframe
      allowfullscreen
      frameborder="0"
      style="width:640px; height:480px"
      src="https://www.lucidchart.com/documents/embeddedchart/5816009d-2043-42a6-9f02-74ff2104999e"
      id="3SaTMoCwDbS-">
    </iframe>
  </div>

  <form (submit)="onAddPost(postForm)" #postForm="ngForm">
    <mat-form-field>
      <input
        matInput
        type="text"
        name="title"
        ngModel
        required
        placeholder="Post Title"
        #title="ngModel">
        <mat-error *ngIf="title.invalid">Please enter a post title.</mat-error>
    </mat-form-field>
    <mat-form-field>
      <textarea
        matInput
        rows="4"
        name="content"
        ngModel
        required
        placeholder="Post Content"
        #content="ngModel"></textarea>
        <mat-error *ngIf="content.invalid">Please enter a post.</mat-error>
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Save Post</button>
  </form>
</mat-card>
